[versions]
agp = "8.10.0"
ksp = "1.9.23-1.0.20" # Newer versions requires newer kotlin releases
ktlint = "11.0.0" # Newer versions needs fair bit of changes

# Dependency versions below this are AOSP versions.
# We use "strictly" to enforce the version cannot be overriden by transitive dependencies.
# We need to enforce that the versions we use are the same as AOSP to ensure compatibility.

# https://android.googlesource.com/platform/external/kotlinc/+/refs/heads/android15-qpr2-release/build.txt
kotlin = { strictly = "1.9.23" }
# https://android.googlesource.com/platform/external/dagger2/+/refs/heads/android15-qpr2-release
hilt = { strictly = "2.51.1" }
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/core/core-ktx?autodive=0
core = { strictly = "1.16.0-alpha01" }
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/appcompat/appcompat?autodive=0
appcompat = { strictly = "1.7.0" } # 1.8.0-alpha01 in AOSP but not released
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/fragment/fragment-ktx?autodive=0
fragment = { strictly = "1.8.6" } # 1.9.0-alpha01 in AOSP but not released
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/activity/activity-ktx?autodive=0
activity = { strictly = "1.10.0-rc01" }
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/lifecycle/lifecycle-viewmodel-ktx?autodive=0
lifecycle = { strictly = "2.9.0-alpha08" }
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/preference/preference?autodive=0
preference = { strictly = "1.2.1" } # 1.3.0-alpha01 in AOSP but as not been released
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/navigation/navigation-ui-ktx?autodive=0
navigation = { strictly = "2.9.0-alpha04" }
# https://android.googlesource.com/platform/prebuilts/sdk/+/android15-qpr2-release/current/androidx/m2repository/androidx/work/work-runtime-ktx?autodive=0
work = { strictly = "2.10.0-rc01" }
# https://android.googlesource.com/platform/prebuilts/sdk/+/refs/heads/android15-qpr2-release/current/extras/material-design-x/Android.bp#7
material = { strictly = "1.13.0-alpha08" }
# https://android.googlesource.com/platform/external/guava/+/refs/heads/android15-qpr2-release/android/pom.xml
guava = { strictly = "32.1.2-android" }
# https://android.googlesource.com/platform/external/kotlinx.serialization/+/refs/heads/android15-qpr2-release/CHANGELOG.md
serialization = { strictly = "1.6.3" }
# https://android.googlesource.com/platform/external/kotlinx.coroutines/+/refs/heads/android15-qpr2-release/CHANGES.md
coroutines = { strictly = "1.8.1" }

[libraries]
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
google-android-material = { module = "com.google.android.material:material", version.ref = "material" }
google-guava = { module = "com.google.guava:guava", version.ref = "guava" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-core = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
jetbrains-kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
jetbrains-kotlin-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android  = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-ksp  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android-plugin = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
jlleitschuh-ktlint  = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
